<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>GPU 드라이버</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style>
body{margin:0}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit}
</style>
</helmet>
<div style="width: 1280px; height: 720px; box-sizing: border-box; display: flex; background: #0B0D10; color: #F1F3F5; font-family: 'IBM Plex Sans KR', sans-serif; overflow: hidden">
  <nav aria-label="주 메뉴" style="width: 104px; flex: none; box-sizing: border-box; padding: 20px 12px; display: flex; flex-direction: column; gap: 8px; background: #101317; border-right: 1px solid #23282F">
    <div style="height: 44px; display: flex; align-items: center; justify-content: center; font-family: 'IBM Plex Mono', monospace; font-weight: 500; font-size: 15px; color: {{accent}}; margin-bottom: 12px">Pagurin</div>
    <a href="Main.dc.html" style="height: 76px; border-radius: 14px; color: #AEB6C0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; font-size: 13px; font-weight: 500">
      <svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="8" height="8" rx="1.5"></rect><rect x="13" y="3" width="8" height="8" rx="1.5"></rect><rect x="3" y="13" width="8" height="8" rx="1.5"></rect><rect x="13" y="13" width="8" height="8" rx="1.5"></rect></svg>
      라이브러리
    </a>
    <a href="Drivers.dc.html" aria-current="page" style="height: 76px; border-radius: 14px; background: #20252C; color: {{accent}}; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; font-size: 13px; font-weight: 600">
      <svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="6" y="6" width="12" height="12" rx="2"></rect><path d="M9 2v4M15 2v4M9 18v4M15 18v4M2 9h4M2 15h4M18 9h4M18 15h4"></path></svg>
      드라이버
    </a>
  </nav>
  <main style="flex: 1; min-width: 0; box-sizing: border-box; padding: 24px 32px 0; display: flex; flex-direction: column">
    <header style="display: flex; align-items: center; gap: 14px; height: 48px">
      <h1 style="margin: 0; font-size: 32px; font-weight: 700; letter-spacing: -0.02em">GPU 드라이버</h1>
      <span style="font-family: 'IBM Plex Mono', monospace; font-size: 14px; color: #AEB6C0">Adreno 740</span>
      <div style="flex: 1"></div>
      <button style="height: 44px; padding: 0 16px; border-radius: 12px; border: 1px solid #2F353E; background: #14181D; font-size: 14px; font-weight: 500">파일에서 추가</button>
    </header>
    <div style="margin-top: 20px; flex: 1; min-height: 0; display: grid; grid-template-columns: 7fr 5fr; gap: 28px">
      <section aria-labelledby="list-title">
        <h2 id="list-title" style="margin: 0 0 8px; font-size: 13px; font-weight: 600; color: #AEB6C0">기본 드라이버 · 따로 지정하지 않은 게임에 적용</h2>
        <div role="radiogroup" aria-labelledby="list-title" style="display: flex; flex-direction: column; gap: 8px">
          <sc-for list="{{drivers}}" as="d" hint-placeholder-count="5">
            <button role="radio" aria-checked="{{d.checked}}" style="width: 100%; height: 76px; padding: 0 16px; box-sizing: border-box; border-radius: 12px; border: {{d.border}}; background: #14181D; display: flex; align-items: center; gap: 14px; text-align: left">
              <span aria-hidden="true" style="width: 20px; height: 20px; flex: none; box-sizing: border-box; border-radius: 50%; border: {{d.dot}}"></span>
              <span style="flex: 1; min-width: 0"><span style="display: block; font-family: 'IBM Plex Mono', monospace; font-size: 14.5px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{d.name}}</span><span style="display: block; margin-top: 5px; font-size: 13px; color: #AEB6C0">{{d.note}}</span></span>
            </button>
          </sc-for>
        </div>
      </section>
      <section aria-labelledby="games-title">
        <h2 id="games-title" style="margin: 0 0 8px; font-size: 13px; font-weight: 600; color: #AEB6C0">게임별로 지정한 드라이버</h2>
        <a href="GamePage.dc.html" style="display: flex; align-items: center; gap: 12px; height: 76px; padding: 0 14px; box-sizing: border-box; border-radius: 12px; background: #14181D">
          <span style="width: 44px; height: 44px; flex: none; border-radius: 10px; background: #27504A; display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 700">G1</span>
          <span style="flex: 1; min-width: 0"><span style="display: block; font-size: 15px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">게임 1</span><span style="display: block; margin-top: 4px; font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: #AEB6C0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">turnip_mrpurple_T30-toasted</span></span>
        </a>
        <p style="margin: 16px 2px 0; font-size: 14px; line-height: 1.65; color: #C5CBD3">드라이버를 바꾸면 게임의 다음 실행부터 적용됩니다. 게임별 지정은 게임 페이지의 설정에서 바꿉니다.</p>
      </section>
    </div>
    <footer style="height: 44px; display: flex; align-items: center; justify-content: flex-end; gap: 22px; font-size: 13px; color: #C5CBD3">
      <span><b style="font-family: 'IBM Plex Mono', monospace; color: #F1F3F5">A</b> 기본으로 지정</span>
      <span><b style="font-family: 'IBM Plex Mono', monospace; color: #F1F3F5">Y</b> 삭제</span>
      <span><b style="font-family: 'IBM Plex Mono', monospace; color: #F1F3F5">LB RB</b> 메뉴 이동</span>
    </footer>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#F5B83D","options":["#F5B83D","#4DA3FF","#5ED6A0","#F1F3F5"]},"$preview":{"width":1280,"height":720}}'>
class Component extends DCLogic {
  renderVals() {
    const accent = this.props.accent ?? '#F5B83D';
    const rows = [['시스템 드라이버', '기기에 설치된 드라이버', true], ['turnip_mrpurple_T30-toasted', '3.7 MB', false], ['turnip_mrpurple_T23-toasted', '3.6 MB', false], ['Turnip-Rutabaga-v3', '3.5 MB', false], ['Balemuni_Apex_v2_ULTIMATE_SD8Gen2', '14.7 MB', false]];
    return {
      accent,
      drivers: rows.map((r) => ({ name: r[0], note: r[1], checked: r[2] ? 'true' : 'false', border: r[2] ? `2px solid ${accent}` : '1px solid #23282F', dot: r[2] ? `6px solid ${accent}` : '2px solid #7C8591' })),
    };
  }
}
</script>
</body>
</html>
