<!doctype html>
<!-- The README's title: the app icon and the name. Made into docs/images/logo.png with headless Chrome on a clear background; the font is Pretendard ExtraBold, installed on the PC -->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Pagurin logo</title>
<style>
@font-face { font-family: "PagurinTitle"; src: local("Pretendard ExtraBold"), local("Pretendard-ExtraBold"); font-weight: 800 }
html, body { margin: 0; width: 1400px; height: 400px; background: transparent }
.logo { position: absolute; left: 0; top: 0; width: 1400px; height: 400px; display: flex; align-items: center; justify-content: center; gap: 36px }
img { width: 300px; height: 300px }
span { font-family: "PagurinTitle", "Pretendard", sans-serif; font-weight: 800; font-size: 200px; line-height: 1; letter-spacing: -0.02em; color: #F58837 }
</style>
</head>
<body>
<div class="logo"><img src="../artwork/pagurin-icon.png" alt=""><span>Pagurin</span></div>
</body>
</html>
